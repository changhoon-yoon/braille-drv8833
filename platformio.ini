; ESP32-S3 DevKitC (N16R8: 16MB Flash + 8MB Octal PSRAM) + DRV8833
; PlatformIO에서 이 폴더를 열면 자동 인식됩니다.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 메모리 구성
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed = 921600

; 시리얼 포트 선택: 현재 "COM"(CH343/UART) 라벨 포트 사용 중 → 0.
; 나중에 "USB"(네이티브) 포트로 옮기면 1로 바꾸고 재업로드.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0

; USB 꽂는 자리에 따라 COM 번호가 바뀜(COM5→COM8 이력) — 고정하지 않고
; CH343 하나뿐이므로 자동 탐지에 맡긴다. 여러 개 잡히면 다시 지정할 것.

