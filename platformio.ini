; ESP32-S3 DevKitC (N16R8: 16MB Flash + 8MB Octal PSRAM) + DRV8833
; PlatformIO에서 이 폴더를 열면 자동 인식됩니다.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 메모리 구성
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed = 921600

; 보드의 "USB"(네이티브) 포트로 시리얼을 쓰기 위한 플래그.
; 만약 "COM"(UART) 라벨 포트에 꽂았는데 시리얼 모니터가 안 보이면
; 아래 줄의 1을 0으로 바꾸고 다시 업로드하세요.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
